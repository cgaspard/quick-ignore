name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          pkg_version=$(node -p "require('./package.json').version")

          if [ "$version" != "$pkg_version" ]; then
            echo "::error::Tag version ($version) does not match package.json version ($pkg_version)."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build .vsix
        run: npm run package:vsix

      - name: Locate .vsix
        id: vsix
        run: |
          vsix=$(ls -1 *.vsix | head -n1)
          if [ -z "$vsix" ]; then
            echo "::error::No .vsix produced."
            exit 1
          fi
          echo "path=$vsix" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.vsix.outputs.path }}" \
            --title "${{ steps.version.outputs.tag }}"

      - name: Publish to VS Code Marketplace
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set."
            exit 1
          fi
          npx vsce publish --packagePath "${{ steps.vsix.outputs.path }}"
